[workspace]
resolver = "3"
members = [
    "crates/pulsar-common",
    "crates/pulsar-api",
    "crates/pulsar-auth",
    "crates/pulsar-gateway",
    "crates/pulsar-messaging",
    "crates/pulsar-db",
    "crates/pulsar-storage",
    "crates/pulsar-crypto",
    "crates/pulsar-scylla",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3"


[workspace.dependencies]
tokio = { version = "1", features = ["full", "sync"] }
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.12", features = ["multipart", "cookie"] }
time = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
async-nats = "0.49"
bytes = "1.11.1"
tower-http = { version = "0.6", features = ["cors"] }
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "migrate",
    "uuid",
] }
rand = "0.10"
dotenvy = "0.15"
aws-sdk-s3 = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
md-5 = "0.11"
base64 = "0.22"
aes-gcm = "0.10"
hex = "0.4"
sha2 = "0.10"
pulsar-crypto = { path = "crates/pulsar-crypto" }
pulsar-scylla = { path = "crates/pulsar-scylla" }
scylla = "1"
deadpool-redis = { version = "0.23", features = ["rt_tokio_1"] }
redis = { version = "1.2", features = ["tokio-comp"] }
