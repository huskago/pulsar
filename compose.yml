services:
  db:
    image: postgres:18
    container_name: pulsar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulsar
      POSTGRES_PASSWORD: pulsar
      POSTGRES_DB: pulsar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsar"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:latest
    container_name: pulsar-nats
    command: "-js"
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"

  minio:
    image: minio/minio
    container_name: pulsar-minio
    restart: unless-stopped
    command: 'server /data --console-address ":9001"'
    environment:
      MINIO_ROOT_USER: pulsar
      MINIO_ROOT_PASSWORD: pulsarsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  scylladb:
    image: scylladb/scylla
    container_name: pulsar-scylla
    restart: unless-stopped
    command: "--smp 1 --memory 512M --developer-mode 1"
    ports:
      - "9042:9042"
    volumes:
      - scylla_data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  redis:
    image: redis:8-alpine
    container_name: pulsar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: pulsar-livekit
    restart: unless-stopped
    command: '--config /etc/livekit/livekit.yaml --keys "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"'
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml
    ports:
      - "7880:7880"             # HTTP / WebSocket
      - "7881:7881"             # RTC over TCP
      - "50000-50100:50000-50100/udp"  # WebRTC media

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: pulsar-api
    container_name: pulsar-api
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://pulsar:pulsar@db:5432/pulsar
      NATS_URL: nats://nats:4222
      STORAGE_ENDPOINT: http://minio:9000
      SCYLLA_URL: scylladb:9042
      REDIS_URL: redis://redis:6379
      # LIVEKIT_URL and STORAGE_PUBLIC_URL come from .env (must be public VPS IP/domain)
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_started
      livekit:
        condition: service_started
      scylladb:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BINARY: pulsar-gateway
    container_name: pulsar-gateway
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgres://pulsar:pulsar@db:5432/pulsar
      NATS_URL: nats://nats:4222
      SCYLLA_URL: scylladb:9042
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started
      scylladb:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Replace with your IP or domain before building
        PUBLIC_API_URL: http://localhost:3000
        PUBLIC_GATEWAY_URL: ws://localhost:3001/gateway
    container_name: pulsar-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
      - gateway

volumes:
  postgres_data:
  minio_data:
  scylla_data:
