port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # Auto-detect public IP — required when running behind NAT/Docker
  use_external_ip: true
logging:
  level: info
# Replace with strong random keys for production (must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env)
keys:
  devkey: secret-must-be-at-least-32-characters-long
